variables:
- name: BuildParameters.mavenPOMFile
  value: pom.xml
name: $(date:yyyyMMdd)$(rev:.r)

jobs:
- job: buildSpringBootRest
  displayName: Build SpringBootRest
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
    fetchTags: false
  - task: Maven@3
    displayName: Maven pom.xml
    inputs:
      mavenPOMFile: $(BuildParameters.mavenPOMFile)
  - script: |
      echo "Fetching logs for Build ID: $(Build.BuildId)"
      response=$(curl -s -u :$(System.AccessToken) \
        "https://dev.azure.com/$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/logs?api-version=7.1-preview.2")
      
      echo "$response"
      # Extract last log URL using jq
      last_url=$(echo "$response" | jq -r '.value[-1].url')

      echo "Last Log URL: $last_url"

      # Save to variable for later steps
      echo "##vso[task.setvariable variable=LastLogUrl]$last_url"
    displayName: "Fetch Last Log URL"
    env:
      System.AccessToken: $(System.AccessToken)
    condition: always()

  - script: |
      error_log=$(curl -s -u :$(System.AccessToken) $last_url) \
        | grep -i -A 20 -B 20 "\[ERROR\]" build.log > error-snippet.log || true
      echo "==== Extracted error log ===="
      cat error-snippet.log || echo "No errors found"
    displayName: "Extract Error Snippet"
    condition: always()

